    <style>
        .aspect-ratio-box { aspect-ratio: 16 / 9; }
        
        /* 動畫特效 */
        @keyframes pulse-hover {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.4)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.4)); }
        }
        .interactive-item { position: absolute; cursor: pointer; transition: all 0.3s ease; }
        .interactive-item:hover { animation: pulse-hover 1.2s infinite ease-in-out; z-index: 10; }
        
        @keyframes mild-pulse-hover {
            0% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.2)); }
            50% { transform: scale(1.015); filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.4)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(255, 255, 255, 0.2)); }
        }
        .mild-interactive-item { position: absolute; cursor: pointer; transition: all 0.3s ease; }
        .mild-interactive-item:hover { animation: mild-pulse-hover 1.2s infinite ease-in-out; z-index: 10; }
        
        .hidden-scene { opacity: 0; pointer-events: none; position: absolute; inset: 0; }
        .active-scene { opacity: 1; pointer-events: auto; position: absolute; inset: 0; }
        .fade-in { transition: opacity 1s ease-in-out; }

        @keyframes blink-border {
            0%, 100% { border-color: white; box-shadow: 0 0 10px white; background-color: rgba(255, 255, 255, 0.2); }
            50% { border-color: transparent; }
        }
        
        .blinking-input {
            position: absolute;
            border: 2px solid red;
            animation: blink-border 1.5s infinite;
            background: transparent;
            outline: none;
            z-index: 60;
            color: black;
            font-size: 16px; 
            text-align: center;
            border-radius: 4px;
        }
        
        @keyframes glow-pulse {
            0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.6)); opacity: 0.8; }
            50% { filter: drop-shadow(0 0 15px rgba(255, 255, 255, 1)); opacity: 1; }
        }
        .arrow-glow { animation: glow-pulse 2s infinite ease-in-out; }
        
        @keyframes breathing-hover {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.2)); }
            50% { transform: scale(1.05); filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.2)); }
        }
        .breathing-item { position: absolute; cursor: pointer; transition: all 0.6s ease; }
        .breathing-item:hover { animation: breathing-hover 2.5s infinite ease-in-out; z-index: 10; }

        @keyframes subtle-breathing-hover {
            0% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.3)); }
            50% { transform: scale(1.01); filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.7)); }
            100% { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.3)); }
        }
        .subtle-breathing-item { position: absolute; cursor: pointer; transition: all 0.6s ease; }
        .subtle-breathing-item:hover { animation: subtle-breathing-hover 3s infinite ease-in-out; z-index: 10; }

        .fade-left-bottom {
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 12%), linear-gradient(to top, transparent 0%, black 12%);
            -webkit-mask-composite: source-in;
            mask-image: linear-gradient(to right, transparent 0%, black 12%), linear-gradient(to top, transparent 0%, black 12%);
            mask-composite: intersect;
        }

        /* 收集欄插槽動畫 */
        @keyframes slot-unlock {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); box-shadow: 0 0 15px #60a5fa; }
            100% { transform: scale(1); box-shadow: 0 0 5px #60a5fa; }
        }
        .slot-filled { animation: slot-unlock 0.5s ease-out forwards; }
    </style>
</head>

    <script>
        let collectedItemsCount = 0;
        const MAX_ITEMS = 5;
        const collectedIds = new Set();

        function collectEvidence(itemId, imgUrl, itemName) {
            if (collectedIds.has(itemId) || collectedItemsCount >= MAX_ITEMS) return;
            
            collectedIds.add(itemId);
            collectedItemsCount++;
            
            document.getElementById('evidence-count').innerText = `(${collectedItemsCount}/${MAX_ITEMS})`;
            
            const slot = document.getElementById(`slot-${collectedItemsCount}`);
            slot.classList.remove('border-dashed', 'border-gray-600', 'text-gray-500');
            // 加入游標特效與發光效果讓玩家知道可以點擊
            slot.classList.add('border-solid', 'border-blue-400', 'text-white', 'bg-blue-900/30', 'slot-filled', 'cursor-pointer', 'hover:bg-blue-800/60', 'transition-colors');
            
            slot.innerHTML = `
                <img src="${imgUrl}" alt="${itemName}" class="w-8 h-8 sm:w-10 sm:h-10 lg:w-16 lg:h-16 object-contain mb-1 drop-shadow-md">
                <div class="text-[10px] lg:text-xs font-bold text-blue-200 text-center leading-tight px-1">${itemName}</div>
            `;

                    setTimeout(() => bg.src = imgHalf, 60);
                    setTimeout(() => bg.src = imgClosed, 120);
                    setTimeout(() => bg.src = imgHalf, 180);
                    setTimeout(() => bg.src = imgOpen, 240);
                }
                if (intNurse && !intNurse.classList.contains('hidden')) {
                    setTimeout(() => intNurse.src = intNurseHalf, 60);
                    setTimeout(() => intNurse.src = intNurseClosed, 120);
                    setTimeout(() => intNurse.src = intNurseHalf, 180);
                    setTimeout(() => intNurse.src = intNurseOpen, 240);
                }
            }, 3500); 
        }

        function stopBlinking() { if (blinkTimer) clearInterval(blinkTimer); }

        function startMonitorAnimation() {
            if (monitorTimer) clearInterval(monitorTimer);
            const monitorEl = document.getElementById('item-monitor');
            if (!monitorEl) return;
            monitorTimer = setInterval(() => {
                currentMonitorFrame = (currentMonitorFrame + 1) % 19;
                monitorEl.src = monitorImages[currentMonitorFrame];
            }, 100); 
        }

        function stopMonitorAnimation() { if (monitorTimer) clearInterval(monitorTimer); }

        function transitionToWard() {
            stopBlinking();
            const fadeOverlay = document.getElementById('fade-overlay');
            fadeOverlay.classList.remove('opacity-0');
            fadeOverlay.classList.add('opacity-100');
            setTimeout(() => {
                switchScene('scene-hospital', 'scene-ward');
                document.getElementById('nurse-speech').classList.add('hidden');
                startMonitorAnimation(); 
                fadeOverlay.classList.remove('opacity-100');
                fadeOverlay.classList.add('opacity-0');
            }, 1000);
        }

        function goToSon() {
            document.getElementById('nurse-speech').classList.add('hidden');
            stopMonitorAnimation(); 
            const fadeOverlay = document.getElementById('fade-overlay');
            fadeOverlay.classList.remove('opacity-0');
            fadeOverlay.classList.add('opacity-100');
            setTimeout(() => {
                switchScene('scene-ward', 'scene-son');
                fadeOverlay.classList.remove('opacity-100');
                fadeOverlay.classList.add('opacity-0');
            }, 1000);
        }

        function backToWardFromSon() {
            document.getElementById('nurse-speech').classList.add('hidden');
            const fadeOverlay = document.getElementById('fade-overlay');
            fadeOverlay.classList.remove('opacity-0');
            fadeOverlay.classList.add('opacity-100');
            setTimeout(() => {
                switchScene('scene-son', 'scene-ward');
                startMonitorAnimation(); 
                fadeOverlay.classList.remove('opacity-100');
                fadeOverlay.classList.add('opacity-0');
            }, 1000);
        }

        function goToDoctor() {
            document.getElementById('nurse-speech').classList.add('hidden');
            stopMonitorAnimation(); 
            const fadeOverlay = document.getElementById('fade-overlay');
            fadeOverlay.classList.remove('opacity-0');
            fadeOverlay.classList.add('opacity-100');
            
            // 重置燈光狀態與文件透明度
            isLightOn = true;
            document.getElementById('room-darkness').classList.replace('opacity-100', 'opacity-0');
            document.getElementById('item-doctor-doc').style.opacity = '1';

            setTimeout(() => {
                switchScene('scene-ward', 'scene-doctor');
                fadeOverlay.classList.remove('opacity-100');
                fadeOverlay.classList.add('opacity-0');
            }, 1000);
        }

        function backToWardFromDoctor() {
            document.getElementById('nurse-speech').classList.add('hidden');
            const fadeOverlay = document.getElementById('fade-overlay');
            fadeOverlay.classList.remove('opacity-0');
            fadeOverlay.classList.add('opacity-100');
            setTimeout(() => {
                switchScene('scene-doctor', 'scene-ward');
                startMonitorAnimation(); 
                fadeOverlay.classList.remove('opacity-100');
                fadeOverlay.classList.add('opacity-0');
            }, 1000);
        }

        function backToHospitalFromDoctor() {
            document.getElementById('nurse-speech').classList.add('hidden');
            const fadeOverlay = document.getElementById('fade-overlay');
            fadeOverlay.classList.remove('opacity-0');
            fadeOverlay.classList.add('opacity-100');
            setTimeout(() => {
                switchScene('scene-doctor', 'scene-hospital');
                document.getElementById('btn-return-doctor').classList.remove('hidden');
                document.getElementById('item-interactive-nurse').classList.remove('hidden');
                startBlinking(); 
                resetLogbook(); 
                hasReturnedFromDoctor = true; // 標記已從醫生房間回來，準備觸發二次調查
                fadeOverlay.classList.remove('opacity-100');
                fadeOverlay.classList.add('opacity-0');
            }, 1000);
        }

        function goToDoctorFromHospital() {
            document.getElementById('nurse-speech').classList.add('hidden');
            stopBlinking(); 
            const fadeOverlay = document.getElementById('fade-overlay');
            fadeOverlay.classList.remove('opacity-0');
            fadeOverlay.classList.add('opacity-100');
            
            // 重置燈光狀態
            isLightOn = true;
            document.getElementById('room-darkness').classList.replace('opacity-100', 'opacity-0');
            document.getElementById('item-doctor-doc').style.opacity = '1';

            setTimeout(() => {
                switchScene('scene-hospital', 'scene-doctor');
                fadeOverlay.classList.remove('opacity-100');
                fadeOverlay.classList.add('opacity-0');
            }, 1000);
        }

        function checkAnswers() {
            const wardInput = document.getElementById('input-h42').value.trim().toLowerCase();
            const relInput = document.getElementById('input-ruth').value.trim().toLowerCase();
            if (wardInput === 'h18' && ['mother', 'mum', 'mom'].includes(relInput)) {
                isLogbookLocked = true; 
                typeWriterStart("Thank you. You may come in.");
                closeLogBook(); 
                document.getElementById('item-logbook').classList.remove('interactive-item'); 
                document.getElementById('item-logbook').style.pointerEvents = 'none'; 
                
                // 首次提交不再收集證物，僅前往病房
                setTimeout(transitionToWard, 3000);
            } else {
                typeWriterStart("Please make sure the information is correct.");
            }
        }

        function openLogBook() { 
            document.getElementById('modal-logbook').classList.remove('hidden'); 
            
            if (isLogbookLocked) {
                const inputH42 = document.getElementById('input-h42');
                const inputRuth = document.getElementById('input-ruth');
                inputH42.readOnly = true; inputRuth.readOnly = true;
                inputH42.style.animation = 'none'; inputH42.style.border = 'none';
                inputRuth.style.animation = 'none'; inputRuth.style.border = 'none';
                document.getElementById('btn-submit-logbook').classList.add('hidden');
                
                // 從醫生房間回來後：隱藏 recall 按鈕並觸發證物收集
                if (hasReturnedFromDoctor) {
                    const recallBtn = document.getElementById('btn-recall-phone');
                    if (recallBtn) {
                        recallBtn.classList.add('hidden');
                    }
                    
                    if (!collectedIds.has('logbook')) {
                        collectEvidence('logbook', 'https://assets.codepen.io/17688442/Visitor+log+book-png.png', 'Visitor Log');
                        
                        const speechBox = document.getElementById('nurse-speech');
                        speechBox.classList.remove('hidden');
                        document.getElementById('speech-avatar').innerText = "📖";
                        document.getElementById('speech-speaker').innerText = "Observation :";
                        document.getElementById('speech-speaker').className = "text-yellow-400 font-bold text-lg mb-1";
                        hideOptions();
                        typeWriterStart("Re-checking the logbook... there are still no other visitors tonight. Those suspicious grip marks definitely couldn't have been made by an outsider.", () => {
                            showOptions([{ text: "Close", action: () => { hideOptions(); document.getElementById('nurse-speech').classList.add('hidden'); }}]);
                        });
                    }
                }
            }
        }
        
        function closeLogBook() { document.getElementById('modal-logbook').classList.add('hidden'); }
    </script>
</body>
</html>
